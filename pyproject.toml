[project]
name = "pwdgen"
version = "0.1.0"
description = "Secure password generator with strength analysis, custom rules, and CLI interface"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
keywords = ["password", "generator", "security", "cli", "strength", "rules"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

# Project URLs for documentation, repository, and issue tracker
urls = {
    "Homepage" = "https://github.com/yourusername/password-generator",
    "Repository" = "https://github.com/yourusername/password-generator",
    "Bug Tracker" = "https://github.com/yourusername/password-generator/issues",
}

# Entry points for the command-line interface
[project.scripts]
pwdgen = "pwdgen.cli:main"

# Development dependencies (e.g., for testing, linting, formatting, building)
[project.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^24.0"
isort = "^5.10"
mypy = "^1.0"
build = "^1.0"
twine = "^4.0"

# Build system configuration
# Specifies the backend used to build the project (e.g., setuptools)
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Setuptools specific configuration
# Defines how setuptools should find and include packages
[tool.setuptools]
# Automatically discover packages in the 'src' directory
packages = ["src/pwdgen"]

# Tool specific configurations

# Black formatter configuration
# Ensures consistent code formatting across the project
[tool.black]
line-length = 100
target-version = ["py38"] # Match the minimum Python version required

# isort configuration
# Sorts imports alphabetically and separates them into sections
[tool.isort]
profile = "black" # Use Black's formatting style for compatibility
line_length = 100 # Match Black's line length

# pytest configuration
# Settings for the test runner
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-paths --cov=src/pwdgen --cov-report=term-missing"
testpaths = ["tests"] # Directory where tests are located

# MyPy static type checker configuration
# Helps catch type-related errors before runtime
[tool.mypy]
python_version = "3.8" # Match the minimum Python version for type checking
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true # All function definitions must have type hints
check_untyped_defs = true
no_implicit_optional = true # Explicitly declare Optional types
strict_optional = true
warn_return_any = true # Warn if a function returns an 'Any' type
warn_no_return = true # Warn if a function might not return a value
warn_unreachable = true # Warn about unreachable code
# Exclude the build directory from type checking
exclude = "build/"